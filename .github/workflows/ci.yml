name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The default npm on this runner mis-resolves the lockfile's optional
      # esbuild platform packages (EBADPLATFORM on npm ci) — match the npm
      # version the lockfile was generated with.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The default npm on this runner mis-resolves the lockfile's optional
      # esbuild platform packages (EBADPLATFORM on npm ci) — match the npm
      # version the lockfile was generated with.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
